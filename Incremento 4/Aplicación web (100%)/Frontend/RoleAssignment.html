<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gestión de Usuarios</title>

  <!-- TailwindCSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    .animate-spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-purple-50 via-white to-purple-50 p-4">

  <div class="max-w-4xl mx-auto">
    <!-- Volver -->
    <div class="mb-6">
      <a href="Dashboard.html" class="inline-flex items-center gap-2 text-purple-600 hover:text-purple-800 mb-4 transition-colors duration-200">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        Volver al panel de administración
      </a>
    </div>

    <!-- Sección 1: Asignar Rol -->
    <div class="shadow-2xl border-0 bg-white/80 backdrop-blur-sm rounded-xl mb-6">
      <button class="w-full flex justify-between items-center px-6 py-4 text-left text-xl font-semibold text-gray-900 toggle-btn">
        <span class="flex items-center gap-2"><i data-lucide="user-check" class="w-5 h-5"></i> Asignar Rol a Usuario</span>
        <i data-lucide="chevron-down" class="w-5 h-5 transition-transform"></i>
      </button>
      <div class="toggle-content hidden px-6 pb-6 space-y-6">
        <form id="formAsignarRol" class="space-y-4">
          <p class="text-center text-gray-600">Selecciona un usuario y asígnale un rol específico en el sistema</p>
          <div>
            <label for="usuario" class="text-sm font-medium text-gray-700 flex items-center gap-2 mb-1">
              <i data-lucide="users" class="w-4 h-4"></i> Seleccionar Usuario
            </label>
            <select id="selectUsuario" class="w-full h-12 border rounded-md px-3">
              <option value="">Elige un usuario...</option>
            </select>
          </div>
          <div>
            <label for="rol" class="text-sm font-medium text-gray-700 flex items-center gap-2 mb-1">
              <i data-lucide="shield" class="w-4 h-4"></i> Seleccionar Rol
            </label>
            <select id="selectRol" class="w-full h-12 border rounded-md px-3">
              <option value="">Elige un rol...</option>
            </select>
          </div>
          <div id="preview" class="hidden bg-blue-50 border border-blue-200 rounded-lg p-4">
            <div class="flex items-center gap-3">
              <i data-lucide="check-circle" class="w-5 h-5 text-blue-600"></i>
              <div>
                <p class="text-sm font-medium text-blue-900">Vista previa:</p>
                <p class="text-sm text-blue-700" id="previewText"></p>
              </div>
            </div>
          </div>
          <button type="submit" id="btnGuardar"
            class="w-full h-12 bg-blue-600 hover:bg-blue-700 text-white rounded-md flex justify-center items-center gap-2">
            <i data-lucide="user-check" class="w-4 h-4"></i><span>Guardar Rol</span>
          </button>
        </form>
        <p id="mensajeRol"></p>
      </div>
    </div>

    <!-- Sección 2: Crear Usuario -->
    <div class="shadow-2xl border-0 bg-white/80 backdrop-blur-sm rounded-xl mb-6">
      <button class="w-full flex justify-between items-center px-6 py-4 text-left text-xl font-semibold text-gray-900 toggle-btn">
        <span class="flex items-center gap-2"><i data-lucide="user-plus" class="w-5 h-5"></i> Crear Nuevo Usuario</span>
        <i data-lucide="chevron-down" class="w-5 h-5 transition-transform"></i>
      </button>
      <div class="toggle-content hidden px-6 pb-6">
        <form id="createUserForm" class="space-y-4">
          <input type="text" id="nombre" placeholder="Nombre" required class="w-full h-12 border rounded-md px-3"/>
          <input type="text" id="apellido" placeholder="Apellido" required class="w-full h-12 border rounded-md px-3"/>
          <input type="email" id="correo" placeholder="Correo electrónico" required class="w-full h-12 border rounded-md px-3"/>
          <input type="text" id="rut" placeholder="RUT" required class="w-full h-12 border rounded-md px-3"/>
          <input type="password" id="contrasena" placeholder="Contraseña" required class="w-full h-12 border rounded-md px-3"/>
          <select id="rol_id" required class="w-full h-12 border rounded-md px-3">
            <option value="">Selecciona un rol...</option>
            <option value="1">Administrador</option>
            <option value="2">Jefe de Bodega</option>
            <option value="3">Chofer</option>
          </select>
          <button type="submit"
            class="w-full h-12 bg-purple-600 hover:bg-purple-700 text-white rounded-md flex justify-center items-center gap-2">
            <i data-lucide="user-plus" class="w-4 h-4"></i><span>Crear Usuario</span>
          </button>
        </form>
        <p id="mensajeUsuario" class="text-center text-sm text-green-600 mt-2"></p>
      </div>
    </div>

    <!-- Sección 3: Editar Usuario -->
    <div class="shadow-2xl border-0 bg-white/80 backdrop-blur-sm rounded-xl">
      <button class="w-full flex justify-between items-center px-6 py-4 text-left text-xl font-semibold text-gray-900 toggle-btn">
        <span class="flex items-center gap-2"><i data-lucide="edit-3" class="w-5 h-5"></i> Modificar o Desactivar Usuario</span>
        <i data-lucide="chevron-down" class="w-5 h-5 transition-transform"></i>
      </button>
      <div class="toggle-content hidden px-6 pb-6">
        <div id="userList" class="space-y-4">
          <!-- La tabla de usuarios se generará aquí mediante JS -->
        </div>
      </div>
    </div>

    <!-- Footer -->
    <!-- Footer -->
<div class="text-center mt-8 text-xs text-gray-500">
  <p>© 2024 Sistema de Inventario. Gestión de roles y permisos.</p>
</div>

<!-- Modal de confirmación de contraseña -->
<div id="modalConfirmPwd" class="hidden fixed inset-0 items-center justify-center bg-black bg-opacity-50 z-50">
  <div class="bg-white p-6 rounded-xl shadow-lg w-96 mx-auto">
    <h3 class="text-lg font-semibold mb-4 text-gray-900">Confirma tu contraseña</h3>
    <input id="inputPwdConfirm" type="password" placeholder="Ingresa tu contraseña"
           class="w-full border p-2 rounded mb-2 focus:outline-none focus:ring-2 focus:ring-purple-500" />
    <p id="msgPwdError" class="text-red-600 text-sm hidden mb-2"></p>
    <div class="flex justify-end gap-2 mt-4">
      <button id="btnPwdCancel" class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">Cancelar</button>
      <button id="btnPwdOk" class="px-4 py-2 bg-purple-600 text-white rounded hover:bg-purple-700">Aceptar</button>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="js/roleAssignment.js"></script>
<script src="js/sessionTimeout.js"></script>
<script src="js/createUser.js"></script>
<script src="js/editarUsuario.js"></script>
<script>
  lucide.createIcons();
  // Toggle de secciones
  document.querySelectorAll(".toggle-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const content = btn.nextElementSibling;
      const icon = btn.querySelector("i[data-lucide='chevron-down']");
      if (content) content.classList.toggle("hidden");
      if (icon) icon.classList.toggle("rotate-180");
    });
  });
</script>
