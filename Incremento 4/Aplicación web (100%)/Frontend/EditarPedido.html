<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Editar Pedidos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-teal-50 via-white to-teal-50 p-4">
  <div class="max-w-5xl mx-auto">
    <!-- Header -->
    <a href="Dashboard.html" class="inline-flex items-center gap-2 text-teal-600 hover:text-teal-800 mb-6">
      <i data-lucide="arrow-left" class="w-4 h-4"></i> Volver al panel de administración
    </a>

    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-teal-600 rounded-2xl mb-4 shadow-lg">
        <i data-lucide="package" class="w-8 h-8 text-white"></i>
      </div>
      <h1 class="text-3xl font-bold text-gray-900 mb-2">Editar Pedidos</h1>
      <p class="text-gray-600">Seleccione un pedido para modificar su estado, asignar chofer o actualizar detalles</p>
    </div>

    <div class="bg-white/80 backdrop-blur-sm rounded-xl shadow-lg p-4 mb-6">
      <div class="flex items-center gap-2 mb-3">
        <i data-lucide="filter" class="w-5 h-5 text-teal-600"></i>
        <h2 class="text-lg font-semibold text-gray-900">Filtrar Pedidos</h2>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Fecha desde</label>
          <input type="date" id="fechaDesde" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:ring-2 focus:ring-teal-500 focus:border-transparent" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Fecha hasta</label>
          <input type="date" id="fechaHasta" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:ring-2 focus:ring-teal-500 focus:border-transparent" />
        </div>
        <div class="flex items-end gap-2">
          <button id="btnAplicarFiltro" class="flex-1 px-4 py-2 bg-teal-600 text-white rounded-md hover:bg-teal-700 transition-colors">
            Aplicar filtro
          </button>
          <button id="btnLimpiarFiltro" class="px-4 py-2 border border-gray-300 text-gray-700 rounded-md hover:bg-gray-50 transition-colors">
            Limpiar
          </button>
        </div>
      </div>
      <div id="filtroActivo" class="hidden mt-3 text-sm text-teal-700 flex items-center gap-2">
        <i data-lucide="check-circle" class="w-4 h-4"></i>
        <span id="filtroTexto"></span>
      </div>
    </div>

    <!-- Contenedor de cards de pedidos -->
    <div id="pedidosContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Aquí se generarán dinámicamente las cards de cada pedido -->
    </div>

    <div id="mensaje" class="hidden p-3 rounded-md text-white font-semibold"></div>

    <!-- Modal de inspección y despacho -->
    <div id="inspeccionOverlay" class="fixed inset-0 bg-black/40 hidden z-40"></div>
    <div id="inspeccionModal" class="fixed inset-0 hidden z-50 items-center justify-center">
      <div class="bg-white w-full max-w-3xl mx-4 rounded-xl shadow-2xl overflow-hidden">
        <div class="px-5 py-3 bg-teal-600 text-white flex items-center justify-between">
          <div class="flex items-center gap-2">
            <i data-lucide="clipboard-check" class="w-5 h-5"></i>
            <h2 class="font-semibold">Inspección antes de despacho</h2>
          </div>
          <button id="btnCerrarInspeccion" class="hover:bg-teal-700/40 rounded p-1" title="Cerrar">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>
        <form id="inspeccionForm" class="p-5 space-y-4 max-h-[80vh] overflow-y-auto">
          <input type="hidden" id="pedidoIdInspeccion" />

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Vehículo (obligatorio)</label>
              <select id="vehiculoSelect" class="w-full border rounded-md px-2 py-2"></select>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Chofer (opcional)</label>
              <select id="choferInspeccionSelect" class="w-full border rounded-md px-2 py-2"></select>
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Observaciones generales (opcional)</label>
            <textarea id="obsGenerales" rows="2" class="w-full border rounded-md px-3 py-2" placeholder="Notas generales"></textarea>
          </div>

          <div>
            <h3 class="text-base font-semibold text-gray-800 mb-2">Cilindros del pedido</h3>
            <div id="listaCilindrosInspeccion" class="space-y-3"></div>
          </div>

          <div class="flex items-center justify-end gap-3 pt-2">
            <button type="button" id="btnCancelarInspeccion" class="px-4 py-2 rounded-md border border-gray-300 text-gray-700 hover:bg-gray-50">Cancelar</button>
            <button type="submit" class="px-4 py-2 rounded-md bg-teal-600 text-white hover:bg-teal-700">Confirmar e iniciar despacho</button>
          </div>
        </form>
      </div>
    </div>

  </div>

  <script src="js/editarPedido.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
