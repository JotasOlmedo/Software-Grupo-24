<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard</title>

  <!-- TailwindCSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-blue-50 p-4">

  <div class="max-w-6xl mx-auto">
    <!-- Encabezado -->
    <div class="relative mb-8 text-center">
      <div>
        <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-2xl mb-4 shadow-lg mx-auto">
          <i data-lucide="package" class="w-8 h-8 text-white"></i>
        </div>
        <h1 class="text-3xl font-bold text-gray-900 mb-2">Sistema de Gestión</h1>
        <p class="text-gray-600">Panel de administración y control</p>
      </div>
    </div>

    <!-- Barra de búsqueda para filtrar secciones -->
    <div class="mb-8">
      <div class="relative">
        <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>
        <input 
          type="text" 
          id="searchSections" 
          placeholder="Buscar secciones o módulos..." 
          class="w-full pl-12 pr-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        />
      </div>
      <p class="text-sm text-gray-500 mt-2">Escribe para filtrar por nombre de sección o módulo</p>
    </div>

    <!-- Contenedor de secciones (dinámico) -->
    <div id="dashboardContainer" class="space-y-8"></div>

    <!-- Mensaje cuando no hay resultados -->
    <div id="noResults" class="hidden text-center py-12">
      <i data-lucide="search" class="w-16 h-16 text-gray-300 mx-auto mb-4"></i>
      <p class="text-xl text-gray-500">No se encontraron secciones que coincidan con tu búsqueda</p>
    </div>

    <!-- Footer -->
    <div class="text-center mt-12">
      <p class="text-gray-500 text-sm">© 2025 Sistema de Inventario. Todos los derechos reservados.</p>
      <div class="flex items-center justify-center gap-4 mt-4">
        <a href="index.html" class="text-blue-600 hover:text-blue-800 text-sm underline">Cerrar Sesión</a>
        <a href="ResetPassword.html" class="text-blue-600 hover:text-blue-800 text-sm underline">¿Olvidó su contraseña?</a>
      </div>
    </div>
  </div>

  <script src="js/dashboard.js"></script>
  <script src="js/sessionTimeout.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
