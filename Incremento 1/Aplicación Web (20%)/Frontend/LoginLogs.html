<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inicios de Sesión</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-teal-50 via-white to-teal-50 p-4">
  <div class="max-w-6xl mx-auto">
    <!-- Header -->
    <a href="Dashboard.html" class="inline-flex items-center gap-2 text-teal-600 hover:text-teal-800 mb-4">
      <i data-lucide="arrow-left" class="w-4 h-4"></i> Volver al panel de administración
    </a>

    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-teal-600 rounded-2xl mb-4 shadow-lg">
        <i data-lucide="log-in" class="w-8 h-8 text-white"></i>
      </div>
      <h1 class="text-3xl font-bold text-gray-900 mb-2">Inicios de Sesión</h1>
      <p class="text-gray-600">Consultar los intentos de inicio de sesión del sistema</p>
    </div>

    <!-- Filtros -->
    <div class="bg-white/80 backdrop-blur-sm shadow-xl rounded-xl p-6 mb-6">
      <h2 class="text-lg font-semibold flex items-center gap-2 mb-2">
        <i data-lucide="filter" class="w-5 h-5"></i> Filtros de Búsqueda
      </h2>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <div>
          <label class="text-sm font-medium text-gray-700">Usuario</label>
          <input type="text" id="filtroUsuario" placeholder="Nombre de usuario"
            class="h-12 w-full border border-gray-300 rounded-md px-2" />
        </div>
        <div>
          <label class="text-sm font-medium text-gray-700">Fecha Desde</label>
          <input type="date" id="filtroDesde" class="h-12 w-full border border-gray-300 rounded-md px-2" />
        </div>
        <div>
          <label class="text-sm font-medium text-gray-700">Fecha Hasta</label>
          <input type="date" id="filtroHasta" class="h-12 w-full border border-gray-300 rounded-md px-2" />
        </div>
      </div>
      <button id="btnFiltrar" class="mt-4 w-full bg-teal-600 hover:bg-teal-700 text-white h-12 rounded-md shadow">Filtrar</button>
    </div>

    <p id="totalRegistros" class="text-gray-600 mb-2"></p>

    <!-- Tabla -->
    <div class="bg-white/80 backdrop-blur-sm shadow-xl rounded-xl p-6">
      <h2 class="text-lg font-semibold mb-2">Inicios de Sesión Registrados</h2>
      <div class="rounded-lg border overflow-x-auto">
        <table class="min-w-full text-sm" id="tablaLogins">
          <thead class="bg-gray-50 text-gray-700">
            <tr>
              <th class="text-center p-2">Usuario</th>
              <th class="text-center p-2">Fecha</th>
              <th class="text-center p-2">Hora</th>
              <th class="text-center p-2">Acción</th>
            </tr>
          </thead>
          <tbody id="tbodyLogins"></tbody>
        </table>
      </div>
      <div id="vacio" class="text-center text-gray-500 py-6 hidden">
        <div class="w-16 h-16 bg-gray-100 rounded-full mx-auto flex items-center justify-center mb-2">
          <i data-lucide="log-in" class="w-8 h-8 text-gray-400"></i>
        </div>
        No se encontraron registros que coincidan con los filtros.
      </div>
    </div>
  </div>

  <script src="js/loginLogs.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
