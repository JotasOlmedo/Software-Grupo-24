<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat Interno</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-blue-50">

  <div class="max-w-7xl mx-auto p-4 h-screen flex flex-col">
    <div class="mb-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 bg-green-600 rounded-xl flex items-center justify-center shadow-lg">
            <i data-lucide="message-circle" class="w-6 h-6 text-white"></i>
          </div>
          <div>
            <h1 class="text-2xl font-bold text-gray-900">Chat Interno</h1>
            <p class="text-sm text-gray-600">Comunicación entre usuarios del sistema</p>
          </div>
        </div>
        <a href="Dashboard.html" class="inline-flex items-center gap-2 text-blue-600 hover:text-blue-800 mb-4">
      <i data-lucide="arrow-left" class="w-4 h-4"></i> Volver al panel de administración
    </a>
      </div>
    </div>

    <div class="flex-1 bg-white rounded-xl shadow-lg overflow-hidden flex" style="height: calc(100vh - 140px);">
      
      <div class="w-80 border-r border-gray-200 flex flex-col">
        <div class="p-4 border-b border-gray-200">
          <div class="relative">
            <input 
              type="text" 
              id="searchUsers" 
              placeholder="Buscar usuarios..." 
              class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
            />
            <i data-lucide="search" class="w-5 h-5 text-gray-400 absolute left-3 top-2.5"></i>
          </div>
          <div id="userSearchResults" class="mt-2 max-h-48 overflow-y-auto hidden"></div>
        </div>

        <div class="flex-1 overflow-y-auto">
          <div id="conversationsList" class="divide-y divide-gray-100">
          </div>
          <div id="emptyConversations" class="hidden p-8 text-center text-gray-500">
            <i data-lucide="message-square-off" class="w-12 h-12 mx-auto mb-2 text-gray-300"></i>
            <p>No hay conversaciones</p>
            <p class="text-sm">Busca un usuario para iniciar un chat</p>
          </div>
        </div>
      </div>

      <div class="flex-1 flex flex-col">
        <div id="chatHeader" class="hidden p-4 border-b border-gray-200 bg-gray-50">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-white font-semibold">
              <span id="chatUserInitials"></span>
            </div>
            <div>
              <h3 id="chatUserName" class="font-semibold text-gray-900"></h3>
              <p id="chatUserRole" class="text-sm text-gray-600"></p>
            </div>
          </div>
        </div>

        <div id="messagesArea" class="flex-1 overflow-y-auto p-4 space-y-3">
          <div id="welcomeMessage" class="h-full flex items-center justify-center text-center">
            <div>
              <i data-lucide="message-circle" class="w-16 h-16 mx-auto mb-4 text-gray-300"></i>
              <h3 class="text-xl font-semibold text-gray-700 mb-2">Bienvenido al Chat Interno</h3>
              <p class="text-gray-500">Selecciona una conversación o busca un usuario para comenzar</p>
            </div>
          </div>
        </div>

        <div id="messageInputContainer" class="hidden p-4 border-t border-gray-200 bg-gray-50">
          <form id="messageForm" class="flex gap-2">
            <input 
              type="text" 
              id="messageInput" 
              placeholder="Escribe un mensaje..." 
              class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
              required
            />
            <button 
              type="submit" 
              class="px-6 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors flex items-center gap-2"
            >
              <i data-lucide="send" class="w-4 h-4"></i>
            </button>
          </form>
        </div>
      </div>

    </div>
  </div>

  <script src="js/chatInterno.js"></script>
  <script src="js/sessionTimeout.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
