<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Estadísticas Semanales</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-blue-50 p-4">

  <div class="max-w-7xl mx-auto">
     <!-- Header  -->
    <div class="mb-8">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-3xl font-bold text-gray-900 mb-2">Estadísticas Semanales</h1>
          <p class="text-gray-600">Análisis de ventas, clientes y entregas</p>
        </div>
        <a href="Dashboard.html" class="inline-flex items-center gap-2 text-blue-600 hover:text-blue-800 mb-4">
      <i data-lucide="arrow-left" class="w-4 h-4"></i> Volver al panel de administración
    </a>
      </div>
    </div>

     <!-- Filtros de fecha  -->
    <div class="bg-white rounded-xl shadow-lg p-6 mb-6">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Fecha Inicio</label>
          <input type="date" id="fechaInicio" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Fecha Fin</label>
          <input type="date" id="fechaFin" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
        </div>
        <div class="flex items-end">
          <button id="btnFiltrar" class="w-full px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
            Filtrar
          </button>
        </div>
      </div>
    </div>

     <!-- Tarjetas de resumen  -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
      <div class="bg-white rounded-xl shadow-lg p-6">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-gray-600 text-sm">Total Clientes</p>
            <p id="totalClientes" class="text-3xl font-bold text-blue-600">0</p>
          </div>
          <div class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center">
            <i data-lucide="users" class="w-6 h-6 text-blue-600"></i>
          </div>
        </div>
      </div>

      <div class="bg-white rounded-xl shadow-lg p-6">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-gray-600 text-sm">Total Pedidos</p>
            <p id="totalPedidos" class="text-3xl font-bold text-green-600">0</p>
          </div>
          <div class="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center">
            <i data-lucide="package" class="w-6 h-6 text-green-600"></i>
          </div>
        </div>
      </div>

      <div class="bg-white rounded-xl shadow-lg p-6">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-gray-600 text-sm">Entregas Fallidas</p>
            <p id="entregasFallidas" class="text-3xl font-bold text-red-600">0</p>
          </div>
          <div class="w-12 h-12 bg-red-100 rounded-lg flex items-center justify-center">
            <i data-lucide="alert-circle" class="w-6 h-6 text-red-600"></i>
          </div>
        </div>
      </div>
    </div>

     <!-- Gráficos  -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
       <!-- Ventas por día  -->
      <div class="bg-white rounded-xl shadow-lg p-6">
        <h3 class="text-lg font-semibold text-gray-900 mb-4">Ventas por Día</h3>
        <canvas id="chartVentasDia"></canvas>
      </div>

       <!-- Ventas por tipo de cilindro  -->
      <div class="bg-white rounded-xl shadow-lg p-6">
        <h3 class="text-lg font-semibold text-gray-900 mb-4">Ventas por Tipo de Cilindro</h3>
        <canvas id="chartVentasTipo"></canvas>
      </div>
    </div>
  </div>

  <script src="js/estadisticas.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
