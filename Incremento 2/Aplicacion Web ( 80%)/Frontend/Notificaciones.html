<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notificaciones</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-blue-50 p-4">
  <div class="max-w-4xl mx-auto">
    <!-- Header -->
    <div class="mb-8">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-3xl font-bold text-gray-900 mb-2">Notificaciones</h1>
          <p class="text-gray-600">Gestiona tus notificaciones internas</p>
        </div>
        <a href="Dashboard.html" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-lg transition-colors flex items-center gap-2">
          <i data-lucide="arrow-left" class="w-4 h-4"></i>
          Volver
        </a>
      </div>
    </div>

    <!-- Sección para crear notificación (solo admin) -->
    <div id="crearNotificacionSection" class="bg-white rounded-xl shadow-lg p-6 mb-6 hidden">
      <h2 class="text-xl font-semibold mb-4 flex items-center gap-2">
        <i data-lucide="plus-circle" class="w-5 h-5 text-blue-600"></i>
        Enviar Notificación
      </h2>
      <form id="formNotificacion" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Mensaje</label>
          <textarea id="mensaje" rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Escribe tu mensaje aquí..." required></textarea>
        </div>
        <button type="submit" class="w-full px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition-colors flex items-center justify-center gap-2">
          <i data-lucide="send" class="w-4 h-4"></i>
          Enviar Notificación
        </button>
      </form>
    </div>

    <!-- Lista de notificaciones -->
    <div class="bg-white rounded-xl shadow-lg p-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-semibold flex items-center gap-2">
          <i data-lucide="bell" class="w-5 h-5 text-blue-600"></i>
          Mis Notificaciones
        </h2>
      </div>
      
      <div id="listaNotificaciones" class="space-y-3"></div>
      
      <div id="sinNotificaciones" class="text-center py-8 text-gray-500 hidden">
        <i data-lucide="inbox" class="w-12 h-12 mx-auto mb-2 text-gray-400"></i>
        <p>No tienes notificaciones</p>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const currentUser = JSON.parse(localStorage.getItem("currentUser"));
      if (!currentUser) {
        window.location.href = "index.html";
        return;
      }

      const crearSection = document.getElementById("crearNotificacionSection");
      const formNotificacion = document.getElementById("formNotificacion");
      const listaNotificaciones = document.getElementById("listaNotificaciones");
      const sinNotificaciones = document.getElementById("sinNotificaciones");

      // Mostrar sección de crear notificación solo para admin
      crearSection.style.display = currentUser.rol_id === 1 ? "block" : "none";

      // Cargar notificaciones
      await cargarNotificaciones();

      // Solo admin puede enviar notificación
      if (currentUser.rol_id === 1) {
        formNotificacion.addEventListener("submit", async (e) => {
          e.preventDefault();
          const mensaje = document.getElementById("mensaje").value.trim();

          try {
            const response = await fetch("http://localhost:3000/api/notificaciones", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                mensaje: mensaje,
                usuario_admin: currentUser.usuario_id
              }),
            });

            if (response.ok) {
              alert("Notificación enviada correctamente");
              formNotificacion.reset();
              await cargarNotificaciones();
            } else {
              alert("⚠️ Error al enviar notificación");
            }
          } catch (error) {
            console.error("Error:", error);
            alert("Error al enviar notificación");
          }
        });
      }

      async function cargarNotificaciones() {
        try {
          const response = await fetch("http://localhost:3000/api/notificaciones");
          const notificaciones = await response.json();

          listaNotificaciones.innerHTML = "";

          if (notificaciones.length === 0) {
            sinNotificaciones.classList.remove("hidden");
            return;
          }
          sinNotificaciones.classList.add("hidden");

          notificaciones.forEach((notif) => {
            const fecha = notif.fecha
              ? new Date(notif.fecha).toLocaleString("es-CL")
              : "Sin fecha";

            const div = document.createElement("div");
            div.className = `p-4 rounded-lg border-l-4 transition-colors ${
              notif.tipo === "admin"
                ? "border-blue-500 bg-blue-50"
                : "border-green-500 bg-green-50"
            }`;

            div.innerHTML = `
              <div class="flex items-start justify-between">
                <div class="flex-1">
                  <div class="flex items-center gap-2 mb-1">
                    <span class="text-sm text-gray-600">${fecha}</span>
                    <span class="px-2 py-0.5 text-xs rounded-full ${
                      notif.estado === "activa"
                        ? "bg-green-100 text-green-800"
                        : "bg-gray-200 text-gray-600"
                    }">${notif.estado}</span>
                  </div>
                  <p class="font-semibold text-gray-800 mb-1">${
                    notif.tipo === "admin" ? "Admin" : "Automático"
                  }</p>
                  <p class="text-gray-700">${notif.mensaje}</p>
                </div>
                ${
                  currentUser.rol_id === 1
                    ? `<button onclick="eliminarNotificacion(${notif.notificacion_id})"
                        class="p-2 text-red-600 hover:bg-red-100 rounded-lg transition-colors"
                        title="Eliminar">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                      </button>`
                    : ""
                }
              </div>
            `;

            listaNotificaciones.appendChild(div);
          });

          if (lucide) lucide.createIcons();
        } catch (error) {
          console.error("Error al cargar notificaciones:", error);
        }
      }

      // Eliminar notificación (solo admin)
      if (currentUser.rol_id === 1) {
        window.eliminarNotificacion = async (id) => {
          if (!confirm("¿Estás seguro de eliminar esta notificación?")) return;
          try {
            const response = await fetch(`http://localhost:3000/api/notificaciones/${id}`, {
              method: "DELETE",
            });
            if (response.ok) await cargarNotificaciones();
          } catch (error) {
            console.error("Error:", error);
          }
        };
      }
    });

    lucide.createIcons();
  </script>
</body>
</html>
