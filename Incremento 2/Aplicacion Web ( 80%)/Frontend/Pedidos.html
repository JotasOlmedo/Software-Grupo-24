<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gestión de Pedidos - Sistema de Gestión</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-blue-50 p-4">

  <div class="max-w-7xl mx-auto">

    <div class="relative mb-8">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-4">
          <a href="Dashboard.html" class="inline-flex items-center justify-center w-10 h-10 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">
            <i data-lucide="arrow-left" class="w-5 h-5 text-gray-600"></i>
          </a>
          <div>
            <div class="inline-flex items-center justify-center w-12 h-12 bg-blue-600 rounded-xl mb-2 shadow-lg">
              <i data-lucide="truck" class="w-6 h-6 text-white"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-900">Gestión de Pedidos</h1>
            <p class="text-gray-600">Administrar pedidos y asignación de choferes</p>
          </div>
        </div>
      </div>
    </div>

    <div class="bg-white/80 backdrop-blur-sm rounded-xl shadow-lg p-6 mb-6">
      <div class="flex flex-col lg:flex-row gap-4 items-start lg:items-center justify-between">
        <div class="flex flex-col sm:flex-row gap-3 flex-1">
          <div class="relative">
            <i data-lucide="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-gray-400"></i>
            <input 
              type="text" 
              id="searchInput" 
              placeholder="Buscar por ID, cliente o chofer..." 
              class="pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent w-full sm:w-64"
            >
          </div>
          
          <select id="statusFilter" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            <option value="">Todos los estados</option>
            <option value="pendiente">Pendiente</option>
            <option value="asignado">Asignado</option>
            <option value="en_ruta">En Ruta</option>
            <option value="entregado">Entregado</option>
            <option value="cancelado">Cancelado</option>
          </select>

          <select id="paymentFilter" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            <option value="">Estado de pago</option>
            <option value="pendiente">Pago Pendiente</option>
            <option value="pagado">Pagado</option>
          </select>

          <button id="btnBuscarPedidos" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition-colors">
            Buscar
          </button>
        </div>

        <div class="flex gap-2">
          <button onclick="refreshOrders()" class="inline-flex items-center gap-2 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition-colors">
            <i data-lucide="refresh-cw" class="w-4 h-4"></i>
            Actualizar
          </button>
          <button onclick="exportOrders()" class="inline-flex items-center gap-2 px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg transition-colors">
            <i data-lucide="download" class="w-4 h-4"></i>
            Exportar
          </button>
        </div>
      </div>
    </div>

    <div class="bg-white/80 backdrop-blur-sm rounded-xl shadow-lg p-6 mb-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-semibold text-gray-900">Lista de Pedidos</h2>
        <div class="flex items-center gap-4 text-sm text-gray-600">
          <span>Total: <span id="totalOrders" class="font-medium">0</span></span>
          <span>Pendientes: <span id="pendingOrders" class="font-medium text-orange-600">0</span></span>
          <span>Entregados: <span id="deliveredOrders" class="font-medium text-green-600">0</span></span>
        </div>
      </div>

      <div id="resumenResultados" class="text-sm text-gray-600 mb-4"></div>
      
      <div id="resultados" class="hidden">
        <div id="tablaResultados"></div>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();
  </script>
  <script src="js/pedidos.js"></script>
</body>
</html>
