<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alertas de Reposición</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="./js/sessionTimeout.js"></script>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100 min-h-screen">
  <div class="container mx-auto px-4 py-8">
    <!-- Header -->
    <div class="mb-8">
      <a href="Dashboard.html" class="inline-flex items-center text-blue-600 hover:text-blue-800 mb-4">
        <i data-lucide="arrow-left" class="w-5 h-5 mr-2"></i>
        Volver al Dashboard
      </a>
      <h1 class="text-3xl font-bold text-gray-900 mb-2">Alertas de Reposición</h1>
      <p class="text-gray-600">Gestiona las alertas de stock bajo en el inventario</p>
    </div>

    <!-- Alertas Container -->
    <div class="bg-white rounded-xl shadow-lg p-6">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-semibold text-gray-800 flex items-center gap-2">
          <i data-lucide="alert-triangle" class="w-6 h-6 text-amber-600"></i>
          Alertas Activas
        </h2>
        <button onclick="cargarAlertas()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors flex items-center gap-2">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i>
          Actualizar
        </button>
      </div>

      <!-- Lista de alertas -->
      <div id="listaAlertas" class="space-y-4"></div>

      <!-- Sin alertas -->
      <div id="sinAlertas" class="text-center py-12 text-gray-500 hidden">
        <i data-lucide="check-circle" class="w-16 h-16 mx-auto mb-4 text-green-500"></i>
        <p class="text-lg font-medium">No hay alertas activas</p>
        <p class="text-sm">Todas las alertas de stock han sido gestionadas</p>
      </div>
    </div>
  </div>

  <script src="./js/alertasReposicion.js"></script>
</body>
</html>
