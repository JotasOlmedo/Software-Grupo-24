<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gestión de Vehículos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-blue-50 p-4">

  <div class="max-w-6xl mx-auto">
     <!-- Header  -->
    <div class="mb-8">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-3xl font-bold text-gray-900 mb-2">Gestión de Vehículos</h1>
          <p class="text-gray-600">Registrar y administrar vehículos con conductores asignados</p>
        </div>
        <a href="Dashboard.html" class="inline-flex items-center gap-2 text-green-600 hover:text-green-800 mb-4">
          <i data-lucide="arrow-left" class="w-4 h-4"></i> Volver al panel de administración
        </a>
      </div>
    </div>

     <!-- Formulario de registro  -->
    <div class="bg-white rounded-xl shadow-lg p-6 mb-6">
      <h2 class="text-xl font-semibold text-gray-900 mb-4">Registrar Nuevo Vehículo</h2>
      <form id="formVehiculo" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Patente *</label>
          <input type="text" id="patente" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="AA-BB-12">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Conductor (Chofer) *</label>
          <select id="conductorId" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
            <option value="">Seleccione un chofer</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Capacidad (kg)</label>
          <input type="number" id="capacidad" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="500">
        </div>
        <div class="md:col-span-3">
          <button type="submit" class="w-full px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
            <!-- Registrar Vehículo -->
          </button>
        </div>
      </form>
    </div>

     <!-- Lista de vehículos  -->
    <div class="bg-white rounded-xl shadow-lg p-6">
      <h2 class="text-xl font-semibold text-gray-900 mb-4">Vehículos Registrados</h2>
      <div class="overflow-x-auto">
        <table class="w-full">
          <thead>
            <tr class="border-b">
              <th class="text-left py-3 px-4">ID</th>
              <th class="text-left py-3 px-4">Patente</th>
              <th class="text-left py-3 px-4">Conductor</th>
              <th class="text-left py-3 px-4">Capacidad</th>
              <th class="text-center py-3 px-4">Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaVehiculos">
             <!-- Se llenará dinámicamente  -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="js/vehiculos.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
