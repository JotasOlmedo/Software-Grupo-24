<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Editar Pedidos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-teal-50 via-white to-teal-50 p-4">
  <div class="max-w-5xl mx-auto">
    <!-- Header -->
    <a href="Dashboard.html" class="inline-flex items-center gap-2 text-teal-600 hover:text-teal-800 mb-6">
      <i data-lucide="arrow-left" class="w-4 h-4"></i> Volver al panel de administración
    </a>

    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-teal-600 rounded-2xl mb-4 shadow-lg">
        <i data-lucide="package" class="w-8 h-8 text-white"></i>
      </div>
      <h1 class="text-3xl font-bold text-gray-900 mb-2">Editar Pedidos</h1>
      <p class="text-gray-600">Seleccione un pedido para modificar su estado, asignar chofer o actualizar detalles</p>
    </div>

    <!-- Contenedor de cards de pedidos -->
    <div id="pedidosContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Aquí se generarán dinámicamente las cards de cada pedido -->
    </div>

    <div id="mensaje" class="hidden p-3 rounded-md text-white font-semibold"></div>

  </div>

  <script src="js/editarPedido.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
