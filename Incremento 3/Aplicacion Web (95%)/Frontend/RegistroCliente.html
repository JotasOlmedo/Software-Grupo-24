<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registrar Cliente</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-green-50 via-white to-green-50 p-4">
  <div class="max-w-3xl mx-auto">
    <!-- Header -->
    <a href="Dashboard.html" class="inline-flex items-center gap-2 text-green-600 hover:text-green-800 mb-4">
      <i data-lucide="arrow-left" class="w-4 h-4"></i> Volver al panel de administración
    </a>

    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-green-600 rounded-2xl mb-4 shadow-lg">
        <i data-lucide="user-plus" class="w-8 h-8 text-white"></i>
      </div>
      <h1 class="text-3xl font-bold text-gray-900 mb-2">Registrar Nuevo Cliente</h1>
      <p class="text-gray-600">Complete los datos del cliente para agregarlo al sistema</p>
    </div>

    <!-- Formulario de Cliente -->
    <div class="bg-white/80 backdrop-blur-sm shadow-xl rounded-xl p-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <div>
          <label class="text-sm font-medium text-gray-700">Nombre</label>
          <input type="text" id="clienteNombre" class="h-12 w-full border border-gray-300 rounded-md px-2" placeholder="Nombre completo"/>
        </div>
        <div>
          <label class="text-sm font-medium text-gray-700">Dirección</label>
          <input type="text" id="clienteDireccion" class="h-12 w-full border border-gray-300 rounded-md px-2" placeholder="Dirección"/>
        </div>
        <div>
          <label class="text-sm font-medium text-gray-700">Teléfono</label>
          <input type="text" id="clienteTelefono" class="h-12 w-full border border-gray-300 rounded-md px-2" placeholder="Teléfono"/>
        </div>
      </div>

      <div class="text-center">
        <button id="irRegistrarPedido" class="px-6 py-3 bg-blue-600 text-white rounded-xl hover:bg-blue-700 transition"
            onclick="window.location.href='RegistroPedido.html'">
            Ir a Registrar Pedido
        </button>
        <button id="registrarCliente" class="px-6 py-3 bg-green-600 text-white rounded-xl hover:bg-green-700 transition">
          Registrar Cliente
        </button>
      </div>

      <p id="mensajeCliente" class="mt-4 text-center"></p>
    </div>
  </div>

  <script src="js/registroCliente.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
