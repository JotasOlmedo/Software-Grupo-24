<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Objetivos Mensuales</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-blue-50 p-4">

  <div class="max-w-7xl mx-auto"> 
    <div class="mb-8">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-3xl font-bold text-gray-900 mb-2">Objetivos Mensuales</h1>
          <p class="text-gray-600">Gestión y seguimiento de metas de ventas y entregas por chofer</p>
        </div>
        <a href="Dashboard.html" class="inline-flex items-center gap-2 text-blue-600 hover:text-blue-800">
          <i data-lucide="arrow-left" class="w-4 h-4"></i> Volver al panel
        </a>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow-lg p-6 mb-6">
      <div class="flex flex-wrap items-center gap-4">
        <div>
          <label class="text-sm font-medium text-gray-700 block mb-1">Mes:</label>
          <select id="selectMes" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
            <option value="1">Enero</option>
            <option value="2">Febrero</option>
            <option value="3">Marzo</option>
            <option value="4">Abril</option>
            <option value="5">Mayo</option>
            <option value="6">Junio</option>
            <option value="7">Julio</option>
            <option value="8">Agosto</option>
            <option value="9">Septiembre</option>
            <option value="10">Octubre</option>
            <option value="11">Noviembre</option>
            <option value="12">Diciembre</option>
          </select>
        </div>
        <div>
          <label class="text-sm font-medium text-gray-700 block mb-1">Año:</label>
          <select id="selectAnio" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
            <option value="2023">2023</option>
            <option value="2024">2024</option>
            <option value="2025" selected>2025</option>
          </select>
        </div>
        <div>
          <label class="text-sm font-medium text-gray-700 block mb-1">Chofer:</label>
          <select id="selectChofer" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
            <option value="">Todos los choferes</option>
             Se llenará dinámicamente 
          </select>
        </div>
        <div class="flex items-end gap-2">
          <button id="btnCargarCumplimiento" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
            Ver Cumplimiento
          </button>
          <button id="btnMostrarFormulario" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition">
            Definir Objetivos
          </button>
        </div>
      </div>
    </div>

    <div id="formularioObjetivos" class="bg-white rounded-xl shadow-lg p-6 mb-6 hidden">
      <h3 class="text-lg font-semibold text-gray-900 mb-4">Definir Objetivos Mensuales</h3>
      <form id="formObjetivo" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <div>
          <label class="text-sm font-medium text-gray-700 block mb-1">Chofer:</label>
          <select id="choferObjetivo" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required>
            <option value="">Seleccionar chofer</option>
          </select>
        </div>
        <div>
          <label class="text-sm font-medium text-gray-700 block mb-1">Tipo de Objetivo:</label>
          <select id="tipoObjetivo" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required>
            <option value="ventas">Ventas</option>
            <option value="entregas">Entregas</option>
          </select>
        </div>
        <div>
          <label class="text-sm font-medium text-gray-700 block mb-1">Tipo de Cilindro:</label>
          <select id="tipoCilindro" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required>
            <option value="general">General (Todos)</option>
            <option value="5kg">5 kg</option>
            <option value="11kg">11 kg</option>
            <option value="15kg">15 kg</option>
            <option value="45kg">45 kg</option>
          </select>
        </div>
        <div>
          <label class="text-sm font-medium text-gray-700 block mb-1">Meta (Cantidad):</label>
          <input type="number" id="metaCantidad" min="0" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required />
        </div>
        <div class="md:col-span-2 lg:col-span-3 flex gap-2">
          <button type="submit" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
            Guardar Objetivo
          </button>
          <button type="button" id="btnCancelar" class="px-6 py-2 bg-gray-300 text-gray-700 rounded-lg hover:bg-gray-400 transition">
            Cancelar
          </button>
        </div>
      </form>
    </div>


    <div id="seccionCumplimiento" class="bg-white rounded-xl shadow-lg p-6 mb-6 hidden">
      <h3 class="text-lg font-semibold text-gray-900 mb-4">Cumplimiento de Objetivos</h3>
      <div class="mb-4">
        <canvas id="chartCumplimiento"></canvas>
      </div>
    </div>
  </div>

  <script src="js/objetivos.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
